# vim:fileencoding=utf-8:ft=conf
#
# ᚺ  Hagalaz — kitty colors
# Ash-black, bone, iron and blood. Values match ~/.config/omarchy/themes/hagalaz/colors.toml
# Enable with `include hagalaz.conf` in kitty.conf.

foreground              #d5cbbb
background              #0a0807
selection_foreground    #efe8dc
selection_background    #2e2724
cursor                  #c1121f
cursor_text_color       #0a0807
url_color               #c1121f

# Window borders (only visible with multiple kitty windows/splits)
active_border_color     #c1121f
inactive_border_color   #2e2724
bell_border_color       #d4474d

# Tab bar
tab_bar_background      #0a0807
active_tab_foreground   #efe8dc
active_tab_background   #5a0d10
inactive_tab_foreground #6b635c
inactive_tab_background #14100e

#: The color table — near-monochrome, red keeps full punch

#: black
color0  #0a0807
color8  #6b635c

#: red
color1  #b8323a
color9  #d4474d

#: green (sage)
color2  #7d8a68
color10 #9aa886

#: yellow (dusty gold)
color3  #a8956a
color11 #c9b98a

#: blue (grey-blue)
color4  #6f7f8c
color12 #8fa0ae

#: magenta (dusty mauve)
color5  #8c6a76
color13 #ad8b97

#: cyan (muted teal)
color6  #6f8c88
color14 #8fadaa

#: white
color7  #c4bcae
color15 #efe8dc
