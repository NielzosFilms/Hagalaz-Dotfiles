# Hagalaz organ pipes: 4 bars as "a;b;c;d;" lines (0-100) on stdout.
[general]
bars = 4
framerate = 20
autosens = 1
# Low cutoff skips sub-bass rumble; high cutoff keeps the top pipe lively.
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
# Higher = slower, heavier pipes (0-100).
noise_reduction = 82
