# Hagalaz popup organ: 24 mirrored bars (bass in the centre) as
# "a;b;...;" lines (0-100) on stdout. Only runs while the media popup is open.
[general]
bars = 24
framerate = 30
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
noise_reduction = 77
