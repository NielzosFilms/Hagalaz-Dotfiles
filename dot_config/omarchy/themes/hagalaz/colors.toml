# Hagalaz: dark fantasy theme for Omarchy (blood red, near-monochrome terminal)
# Goes in ~/.config/omarchy/themes/hagalaz/colors.toml

mode = "dark"

# blood red
accent    = "#c1121f"
# iron
selection = "#2e2724"
# comments, placeholders
muted     = "#6b635c"

# neutral ramp, darkest to lightest
darker_background  = "#040302"
dark_background    = "#070605"
# ash black
background         = "#0a0807"
# soot
lighter_background = "#14100e"

dark_foreground   = "#867d73"
# bone
foreground        = "#d5cbbb"
light_foreground  = "#e3dacb"
bright_foreground = "#efe8dc"

# window borders (Omarchy 4 reads these; Omarchy 3.x uses the theme's hyprland.conf instead)
# blood to dried blood
hyprland_active_border   = "rgba(c1121fff) rgba(5a0d10ff) 45deg"
# iron
hyprland_inactive_border = "rgba(2e2724ff)"

# terminal colors: desaturated, only red keeps real punch
color0  = "#0a0807"
# muted blood red, also used for urgent notifications
color1  = "#b8323a"
# sage
color2  = "#7d8a68"
# dusty gold
color3  = "#a8956a"
# grey-blue
color4  = "#6f7f8c"
# dusty mauve
color5  = "#8c6a76"
# muted teal
color6  = "#6f8c88"
color7  = "#c4bcae"
# same as muted
color8  = "#6b635c"
color9  = "#d4474d"
color10 = "#9aa886"
color11 = "#c9b98a"
color12 = "#8fa0ae"
color13 = "#ad8b97"
color14 = "#8fadaa"
color15 = "#efe8dc"
